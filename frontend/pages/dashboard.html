<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — SMG IMMOBILIER</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script src="../js/utils/config.js"></script>
  <script src="../js/utils/theme.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">🏢</div>
        <div>SMG <span style="color:var(--primary)">IMMO</span></div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"><!-- menu injecté --></nav>
      <div class="sidebar-footer">
        <div class="nav-item" onclick="Auth.logout()">
          <span class="nav-icon">🚪</span> Déconnexion
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="Layout.toggleSidebar()"></div>

    <!-- MAIN -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="Layout.toggleSidebar()">☰</button>
          <h1 id="pageTitle">Tableau de bord</h1>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap" id="notifDropdown">
            <button class="theme-toggle" onclick="Notifications.toggle()" title="Notifications" style="position:relative">
              🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span>
            </button>
            <div class="notif-panel">
              <div class="notif-header">
                <b>Notifications</b>
                <button class="btn btn-sm btn-outline" onclick="Notifications.markAllRead()">Tout lire</button>
              </div>
              <div id="notifList"><div class="spinner"></div></div>
            </div>
          </div>
          <button class="theme-toggle" onclick="Theme.toggle()">🌙</button>
          <div class="user-chip" onclick="Router.go('profile')" title="Mon profil">
            <div class="user-avatar" id="userAvatar">?</div>
            <div class="user-meta">
              <div class="name" id="userName">—</div>
              <div class="role" id="userRole">—</div>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="appContent">
        <div class="spinner"></div>
      </main>
    </div>
  </div>

  <!-- Utils -->
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/socket.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/utils/modal.js"></script>
  <!-- Layout & router -->
  <!-- Librairies (locales) -->
  <script src="../assets/vendor/jspdf.umd.min.js"></script>
  <script src="../assets/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="../assets/vendor/xlsx.full.min.js"></script>
  <!-- Layout & modules -->
  <script src="../js/modules/layout.js"></script>
  <script src="../js/modules/crud-page.js"></script>
  <script src="../js/modules/notifications.js"></script>
  <script src="../js/modules/communication.js"></script>
  <script src="../js/modules/pdf.js"></script>
  <script src="../js/modules/assistant-bar.js"></script>
  <!-- Pages -->
  <script src="../js/pages/dashboard.page.js"></script>
  <script src="../js/pages/activity.page.js"></script>
  <script src="../js/pages/properties.page.js"></script>
  <script src="../js/pages/apartments.page.js"></script>
  <script src="../js/pages/tenants.page.js"></script>
  <script src="../js/pages/leases.page.js"></script>
  <script src="../js/pages/situation.page.js"></script>
  <script src="../js/pages/payments.page.js"></script>
  <script src="../js/pages/utilities.page.js"></script>
  <script src="../js/pages/maintenance.page.js"></script>
  <script src="../js/pages/expenses.page.js"></script>
  <script src="../js/pages/equipment.page.js"></script>
  <script src="../js/pages/tasks.page.js"></script>
  <script src="../js/pages/calendar.page.js"></script>
  <script src="../js/pages/users.page.js"></script>
  <script src="../js/pages/documents.page.js"></script>
  <script src="../js/pages/reports.page.js"></script>
  <script src="../js/pages/salaries.page.js"></script>
  <script src="../js/pages/profile.page.js"></script>
  <script src="../js/pages/rh.page.js"></script>
  <script src="../js/pages/kanban.page.js"></script>
  <script src="../js/pages/messages.page.js"></script>
  <script src="../js/pages/workflow.page.js"></script>
  <script src="../js/pages/gps.page.js"></script>
  <!-- App init -->
  <script src="../js/app.js"></script>
</body>
</html>
