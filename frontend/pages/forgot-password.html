<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — SMG IMMOBILIER</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/utils/config.js"></script>
  <script src="../js/utils/theme.js"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .fp-card { width: 100%; max-width: 440px; }
    .fp-card .brand-logo { width: 56px; height: 56px; border-radius: 14px; background: var(--hero-gradient); display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin:0 auto 18px; }
    .fp-card h1 { font-size: 24px; text-align: center; margin-bottom: 6px; }
    .fp-card .sub { color: var(--text-muted); text-align: center; margin-bottom: 26px; }
    .top-right { position: fixed; top: 20px; right: 20px; }
    .step { display: none; } .step.active { display: block; }
    .dev-token { margin-top:14px;padding:12px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:12px;word-break:break-all; }
  </style>
</head>
<body>
  <div class="top-right"><button class="theme-toggle" onclick="Theme.toggle()">🌙</button></div>
  <div class="card fp-card"><div class="card-body">
    <div class="brand-logo">🏢</div>

    <!-- Étape 1 : demande -->
    <div class="step active" id="step1">
      <h1>Mot de passe oublié</h1>
      <p class="sub">Saisissez votre email pour réinitialiser votre mot de passe</p>
      <form id="forgotForm">
        <div class="form-group"><label>Adresse email</label>
          <input type="email" id="email" class="form-control" placeholder="vous@smg.com" required /></div>
        <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Envoyer le lien</button>
      </form>
      <div class="dev-token" id="devToken" style="display:none"></div>
    </div>

    <!-- Étape 2 : réinitialisation -->
    <div class="step" id="step2">
      <h1>Nouveau mot de passe</h1>
      <p class="sub">Collez le token reçu et choisissez un nouveau mot de passe</p>
      <form id="resetForm">
        <div class="form-group"><label>Token de réinitialisation</label>
          <input type="text" id="token" class="form-control" required /></div>
        <div class="form-group"><label>Nouveau mot de passe</label>
          <input type="password" id="newPassword" class="form-control" minlength="6" required /></div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Réinitialiser</button>
      </form>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:14px">
      <a href="login.html" style="color:var(--primary)">← Retour à la connexion</a>
    </div>
  </div></div>

  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn'); btn.disabled = true; btn.textContent = 'Envoi...';
      try {
        const res = await API.post('/auth/forgot-password', { email: document.getElementById('email').value.trim() });
        Toast.success('Si le compte existe, un lien a été généré');
        // En mode dev (pas de SMTP), le backend renvoie le token directement
        if (res.data && res.data.resetToken) {
          const box = document.getElementById('devToken');
          box.style.display = 'block';
          box.innerHTML = '<b>Mode démo (sans email) — votre token :</b><br>' + res.data.resetToken;
          document.getElementById('token').value = res.data.resetToken;
        }
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
      } catch (err) { Toast.error(err.message); }
      btn.disabled = false; btn.textContent = 'Envoyer le lien';
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn'); btn.disabled = true; btn.textContent = 'Réinitialisation...';
      try {
        await API.post('/auth/reset-password', {
          token: document.getElementById('token').value.trim(),
          newPassword: document.getElementById('newPassword').value,
        });
        Toast.success('Mot de passe réinitialisé ! Redirection...');
        setTimeout(() => window.location.href = 'login.html', 1200);
      } catch (err) { Toast.error(err.message); btn.disabled = false; btn.textContent = 'Réinitialiser'; }
    });
  </script>
</body>
</html>
